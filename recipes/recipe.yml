---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: secureblue-nvidia-open-hardened
# description will be included in the image's metadata
description: secureblue with GNOME, an optional Niri/DMS session, open NVIDIA and a few personal tweaks

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/silverblue-nvidia-open-hardened
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: rootfs
        destination: / # copies files/rootfs/* (* means everything inside it) into your image's root folder /

  - type: dnf
    # pr-8 enables added repos in a stable order, so repos.override.d is
    # identical across builds (docs/update-size.md). The unified image, because
    # that PR's per-module dnf:pr-8 never published (the fork's CI fails at
    # cosign verify). Back to modules/dnf:latest once
    # fromelicks/blue-build-modules#8 is merged.
    source: ghcr.io/fromelicks/modules:pr-8
    repos:
      files:
        - chatgpt.repo
        - fury-nushell.repo
        - gh-cli.repo
        - netbird.repo
        - terra.repo
        - vscode.repo
      copr:
        enable:
          - name: wezfurlong/wezterm-nightly
            chroot: fedora-44-x86_64
          - name: avengemedia/dms
            chroot: fedora-44-x86_64
    install:
      allow-erasing: true
      packages:
        - repo: openai-chatgpt
          packages:
            - chatgpt
        - chezmoi
        - clang
        - clang-tools-extra
        - code # repo: files:vscode.repo
        - compiler-rt
        - crun-krun # podman --runtime krun: containers in libkrun microVMs. See docs/microvms.md.
        - dms # repo: copr:copr.fedorainfracloud.org:avengemedia:dms
        - emacs
        - fish
        - foot
        - gamescope
        - gh
        - ghostty # repo: terra
        - git
        - golang
        - keepassxc
        - kitty
        - libomp-devel
        - libseccomp-devel
        - lld
        - lldb
        - llvm
        - micro
        - mise
        - nushell # repo: files:fury-nushell.repo
        - niri
        - quickshell # repo: coprdep:copr.fedorainfracloud.org:avengemedia:danklinux
        - qt6-qtdeclarative-devel # ships qmllint-qt6 for DMS's `make lint-qml`
        - rclone
        - sbcl
        - syncthing
        - wezterm # repo: copr:copr.fedorainfracloud.org:wezfurlong:wezterm-nightly
        - xpra
        - xwayland-satellite
        - zed # repo: files:terra.repo
        - repo: terra
          packages:
            - terra-release
            - terra-gpg-keys
    remove:
      # It owns /usr/bin/qs and must not remain alongside AvengeMedia's
      # quickshell. This also cleans up images built before quickshell was
      # selected explicitly.
      auto-remove: false
      packages:
        - noctalia-qs

  # Apply distribution policy after installing DMS so a future RPM-owned file
  # at the same path cannot replace the image's policy.
  - type: files
    files:
      - source: dms-policy
        destination: /

  # These scripts patch RPM-owned files, so they must run after dnf.
  - type: script
    scripts:
      - patch-dms-lockscreen.sh # See docs/niri-dms.md.
      - vscode-standard-malloc.sh # See docs/vscode-hardened-malloc.md.
      - chatgpt-integration.sh # Native Wayland and standard malloc; docs/chatgpt.md.

  - type: script
    scripts:
      - install-netbird.sh

  # Unpacks Anthropic's signed .deb (there is no RPM yet) and wraps the
  # launcher in with-standard-malloc. After dnf: needs `ar` from binutils.
  # See docs/claude-desktop.md.
  - type: script
    scripts:
      - install-claude-desktop.sh

  - type: systemd
    system:
      enabled:
        - btmon-capture.service
        - fromelicks-io-cost.service
        - gnome-hang-monitor.service
        - netbird.service
    user:
      enabled:
        - syncthing.service

  - type: gschema-overrides

  - type: gnome-extensions
    install:
      - 6099 # PaperWM

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: user
        # If no repo information is specified, Flathub will be used by default
        install:
          - org.gnome.Loupe
          - org.gnome.Calendar
          - org.gnome.Extensions
          - org.gnome.TextEditor
          - org.gnome.Weather

  # These land in /usr/lib/bootc/kargs.d/bluebuild-kargs.toml, which ONLY bootc
  # reads, and which bootc applies as a delta against the booted deployment --
  # not as desired state. An rpm-ostree deployment drops them silently, and a
  # karg first shipped under one is then unreachable forever. Update with
  # `bootc upgrade` and verify /proc/cmdline. See docs/kernel-arguments.md.
  - type: kargs
    kargs:
      - loglevel=4
      # Crash capture. reserve_mem= declares a named 2 MiB region (kernel >= 6.14)
      # and ramoops attaches to it by name, so no physical address is hard-coded.
      # The panic dmesg survives a warm reboot in that RAM and systemd-pstore
      # archives it to /var/lib/systemd/pstore on the next boot.
      # See docs/crash-capture.md.
      - reserve_mem=2M:4096:oops
      - ramoops.mem_name=oops
      - ramoops.ecc=1

  - type: justfiles
    validate: true

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
    source: ghcr.io/fromelicks/modules:pr-4

  # MUST stay the last module (the build workflow fails otherwise). Zeroes the
  # mtimes that made ~40 chunkah layers (~1.6 GB) change digest every day with
  # identical contents. ostree drops mtimes on import, so the zeroing itself is
  # invisible when deployed; it also regenerates the fontconfig caches (which
  # then validate at runtime) and empties the image's /run.
  # See docs/update-size.md.
  - type: script
    scripts:
      - normalize-mtimes.sh
