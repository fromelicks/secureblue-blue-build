name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # normalize-mtimes.sh only works as the last module: anything a later
      # module writes gets a fresh mtime, and the daily re-download of
      # unchanged layers comes back silently. See docs/update-size.md.
      - name: Check that normalize-mtimes.sh is the last module
        env:
          RECIPE: recipes/${{ matrix.recipe }}
        run: |
          yq -e '.modules[-1].type == "script" and .modules[-1].scripts[-1] == "normalize-mtimes.sh"' "$RECIPE" ||
            { echo "::error file=$RECIPE::normalize-mtimes.sh must be the last module (docs/update-size.md)"; exit 1; }

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

          chunkah: true
          build_opts: --chunkah-version v0.6.0
          use_cache: true

  report-scheduled-failure:
    name: Report scheduled build failure
    needs: bluebuild
    if: ${{ always() && github.event_name == 'schedule' && needs.bluebuild.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue if no build-failure issue is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='Scheduled image build is failing'
          ISSUE=$(gh issue list --state open --search '"Scheduled image build is failing" in:title' \
            --json number,title --jq '.[] | select(.title == "Scheduled image build is failing") | .number')
          if [[ -n "$ISSUE" ]]; then
            echo "A scheduled-build failure is already tracked: $ISSUE"
            exit 0
          fi
          cat > "$RUNNER_TEMP/build-failure.md" <<EOF
          A scheduled image build failed: $RUN_URL

          Daily builds carry secureblue base updates into this image. While they fail,
          the published image stops receiving those updates, even if the failing step
          belongs to an optional application.

          Investigate the failed step and restore the build. This issue deduplicates
          further scheduled failures; check the Actions history for subsequent runs.
          Close it after a successful scheduled build so a later regression opens a
          new issue.
          EOF
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/build-failure.md"
