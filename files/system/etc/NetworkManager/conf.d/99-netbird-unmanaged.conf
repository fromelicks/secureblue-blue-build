# NetBird manages its own wt0 kernel WireGuard interface (routes, fwmark, DNS).
# Without this, NetworkManager adopts wt0 and auto-creates duplicate 'wt0'
# connection profiles plus a phantom fwmark/policy-routing rule, which drifts
# and can interfere with NetBird's own routing. Keep NM off the interface;
# other WireGuard connections stay NM-managed so their
# DNS still flows to dnsconfd.
[keyfile]
unmanaged-devices=interface-name:wt0
