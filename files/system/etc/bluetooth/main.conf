# BlueZ main.conf overlay — fromelicks/secureblue
#
# Purpose: candidate mitigations for the Logi POP Mouse "MIC Failure (0x3d)"
# mid-session BLE disconnect. See GitHub issue #21 and docs/bt-mouse-reconnect.md
# for the full diagnosis (encryption-state bug; NOT coex/dual-boot/firmware-age).
#
# secureblue ships the stock all-default main.conf (every key commented), so this
# minimal overlay adds no regressions — every option not set here uses BlueZ defaults.
#
# NOTE ON SEQUENCING: run the "several Linux-only reboots, no Windows between"
# discriminator test on the CURRENT image FIRST (see issue #21) before deploying
# this, so the test result isn't confounded by a config change.

[General]
# Enable experimental LE code paths. Several Logitech-LE reconnection bugs are only
# handled behind this gate. Not a crypto/pairing/privacy downgrade; it does expose
# experimental D-Bus interfaces (mild attack-surface increase) — acceptable here.
Experimental = true

# --- Opt-in only: both WEAKEN Bluetooth security. Left disabled by default. ---
#
# JustWorksRepairing: auto-accepts unauthenticated re-pairing when a peer's keys no
# longer match, converting a hard 0x3d loop into an automatic re-bond. Security cost:
# accepts unauthenticated re-pairing (MITM risk, low for a HID mouse). Uncomment to try.
# JustWorksRepairing = always
#
# Privacy: disabling LE privacy (RPA) can fix IRK/RPA-resolution mismatches, but makes
# the adapter's BLE address trackable. Privacy downgrade. Uncomment to try.
# Privacy = off
