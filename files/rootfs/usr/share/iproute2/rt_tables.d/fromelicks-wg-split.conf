# Routing tables reserved for /usr/libexec/fromelicks-wg-split-confine: one per
# confined WireGuard profile, holding only that tunnel's routes. Chosen clear of
# 51820 (wg-quick's full-tunnel fwmark/table; NetworkManager picks its own
# automatically), NetBird (7120) and NetworkManager's routed-dns (20053).
# Names are cosmetic: NetworkManager only accepts table numbers.
18000	wgsplit0
18001	wgsplit1
18002	wgsplit2
18003	wgsplit3
18004	wgsplit4
18005	wgsplit5
18006	wgsplit6
18007	wgsplit7
18008	wgsplit8
18009	wgsplit9
