# Do not start Syncthing in GDM's greeter session.
#
# The recipe enables syncthing.service as a *user* unit, which BlueBuild does
# globally via /etc/systemd/user/default.target.wants/. GDM's greeter runs its
# own full systemd user manager (user@60578.service, user "gdm-greeter" since
# the dynamic-user migration recorded in /var/lib/gdm/.migrated-dyn-users), so
# the global enablement started a second Syncthing there at boot.
#
# That greeter instance generated its own device ID and took ports 22000 and
# 8384 before login, after which the real session's instance could never bind:
#
#   syncthing: Failed to listen (TCP) ... 0.0.0.0:22000: bind: address already in use
#   syncthing: Failed to start API ... 127.0.0.1:8384: bind: address already in use
#   systemd: syncthing.service: Start request repeated too quickly.
#
# gdm-greeter's UID is 60578, so ConditionUser=!@system does not exclude it --
# the home-directory check is what does. /var/home/gdm-greeter does not exist.
# This is the same condition pair ublue uses on user-flatpak-setup.service.

[Unit]
ConditionUser=!@system
ConditionPathIsDirectory=/var/home/%u
