# Let the graphical session win contention against user applications.
#
# session.slice holds gnome-shell, pipewire, wireplumber, dbus-broker and the
# xdg portals. Upstream gives every user slice CPUWeight=100, so a fork-heavy
# app competes with the compositor on equal terms. Weights are work-conserving:
# a priority, not a cap.
#
# IOWeight only has an effect because fromelicks-io-cost.service enables the
# io.cost controller; under NVMe's default "none" scheduler it is inert.
[Slice]
CPUWeight=5000
IOWeight=1000

# Keep the session's pages out of reclaim. MemoryMin is the hard floor;
# MemoryLow is best-effort and gets walked through under global pressure.
#
# MemoryLow sits just above the ~1.4 GiB working set on purpose: under
# memory_recursiveprot, protection this slice cannot claim goes to app.slice.
# Every ancestor must carry at least these values (user.slice, user-.slice and
# user@.service drop-ins). See docs/memory-pressure-hangs.md.
MemoryMin=1.5G
MemoryLow=2G
