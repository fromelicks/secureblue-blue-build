# Guarantee the graphical session wins the CPU against user applications.
#
# session.slice holds gnome-shell (Slice=session.slice in org.gnome.Shell@.service),
# pipewire, wireplumber, dbus-broker and the xdg portals. Upstream ships every
# user slice at CPUWeight=100, so a single app scope that spawns thousands of
# short-lived processes can crowd out the compositor on the runqueue.
#
# CPU weights are work-conserving: this slice only consumes what it actually
# needs and applications keep the remainder. It is a priority, not a cap.
#
# IOWeight requires an active I/O controller. NVMe defaults to scheduler "none",
# where io.weight is inert, so fromelicks-io-cost.service enables the io.cost
# controller to make these weights effective.

[Slice]
CPUWeight=5000
IOWeight=1000

# Keep the compositor's and the audio stack's pages out of reclaim under memory
# pressure. Best-effort: unreclaimed memory below this is protected first.
MemoryLow=1G
