# Keep systemd-oomd's pressure kill off deliberate heavy jobs: a job streaming
# through swap holds memory PSI above 80% for as long as it runs, which is the
# job working, not a fault.
#
# `auto` means "not monitored". The values are auto|kill; anything else (e.g.
# `none`) is logged as invalid and ignored, leaving Fedora's kill in force.
#
# Named 50- for the same reason as app.slice.d/50-fromelicks-oomd.conf: it must
# sort after Fedora's type-wide slice.d/10-oomd-per-slice-defaults.conf.
#
# ManagedOOMPreference=omit is not an alternative: oomd only honours it on
# root-owned cgroups (systemd.resource-control(5)), and this one is the user's.
[Slice]
ManagedOOMMemoryPressure=auto
