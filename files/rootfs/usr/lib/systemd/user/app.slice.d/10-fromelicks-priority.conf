# Deprioritise user applications relative to the graphical session.
#
# See session.slice.d/10-fromelicks-priority.conf. This is a *weight*, not a
# quota: when the session is idle, applications still get the entire machine.
# It only decides who wins when both want the CPU at the same instant.
#
# Consequence worth knowing: your terminal emulator also lives here, so a
# runaway app in another scope is prioritised the same as the terminal you would
# use to kill it. Use `ujust boost-app <pattern>` to raise one scope at runtime.

[Slice]
CPUWeight=50
IOWeight=100
