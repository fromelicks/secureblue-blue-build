# Deprioritise user applications against the session (see session.slice.d).
# A weight, not a quota: an idle session leaves applications the whole machine.
#
# Your terminal lives here too, so it has no edge over a runaway app in another
# scope; `ujust boost-app <pattern>` raises one scope at runtime.
[Slice]
CPUWeight=50
IOWeight=100

# Throttle a runaway application before it takes the machine. See
# docs/memory-pressure-hangs.md.
#
# MemoryHigh, not MemoryMax: memory.max only kills once reclaim fails, so with
# swap available a working set above it thrashes indefinitely. memory.high
# throttles and reclaims instead -- which needs a disk swap tier to reclaim to;
# with zram alone it degenerates into a reclaim loop.
#
# A percentage because containment should scale with the machine. 65% leaves
# room for session.slice, system.slice and zram, whose RAM is not charged to
# this cgroup and so adds on top of it (up to ~6 GiB at 16 GiB of zram).
#
# Jobs expected to exceed RAM belong in workload.slice (`ujust heavy-run`).
# The matching oomd limit is in 50-fromelicks-oomd.conf.
MemoryHigh=65%
