# Raise systemd-oomd's pressure limit so MemoryHigh throttling is not itself a
# kill trigger. memory.high works by stalling allocations -- the memory PSI oomd
# watches -- so at Fedora's 80% a throttled app.slice would be killed for being
# throttled. Above 95% oomd still acts as the last resort.
#
# Named 50- on purpose: Fedora's type-wide
# /usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf sets 80%, and
# drop-ins with different names apply in lexicographic order across all
# directories. A type-level file only loses to a unit-level one of the SAME
# name, so anything sorting before "10-oomd-per-slice-defaults.conf" is
# silently overridden.
[Slice]
ManagedOOMMemoryPressureLimit=95%
