# Open the reclaim-protection path down to session.slice.
#
# cgroup v2 caps a cgroup's *effective* memory.low by that of every ancestor:
# "effective low is limited by memory.low of all ancestor cgroups". Upstream
# leaves user.slice, user-<uid>.slice and user@<uid>.service all at 0, so the
# MemoryLow=1G on session.slice was silently effective-0 and protected nothing.
# uresourced does not set these either.
#
# This is protection, not reservation: unused memory here stays available to
# everything else, and the kernel only declines to reclaim below it while other
# reclaimable memory exists.

[Service]
MemoryLow=1G
