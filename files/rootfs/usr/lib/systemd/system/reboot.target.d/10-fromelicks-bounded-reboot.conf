# Bound an orderly reboot that cannot finish.
#
# systemd's default JobTimeoutSec for reboot.target is 30 minutes. A reboot
# blocked by unkillable processes therefore looks like a dead machine for half
# an hour, and RebootWatchdogSec= (10-watchdog.conf) cannot help: it only arms
# in the final systemd-shutdown stage, which such a reboot never reaches.
#
# That is not hypothetical here. On 2026-09-23 gnome-hang-monitor.service
# ordered a reboot to escape an NVIDIA driver wedge; shutdown crawled through
# per-unit kill ladders for processes stuck in D and had not finished 10-20
# minutes later, ending in a hard power-off. See docs/nvidia-dpms-lock-hang.md.
#
# 180 s is generous: a healthy shutdown on this machine reaches reboot about
# 2 s after graphical.target stops. reboot-force skips remaining unit stops and
# unmounts, so filesystems replay their journals on the next boot -- the same
# outcome as the power button, minus the wait. Note that poweroff.target and
# halt.target keep the 30-minute default; only the automatic recovery path
# reboots.
[Unit]
JobTimeoutSec=180
JobTimeoutAction=reboot-force
