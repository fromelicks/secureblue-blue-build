# Session memory protection, ancestor link 1 of 3 (user.slice -> user-.slice
# -> user@.service -> session.slice). See docs/memory-pressure-hangs.md.
#
# Effective memory.min/low is capped by every ancestor and upstream leaves each
# level at 0, so without this chain session.slice's protection is effective-0.
# Protection, not reservation: unused memory stays available to everything.
#
# Set ABOVE session.slice, not equal: user-.slice.d also applies to the GDM
# greeter's user slice (AGENTS.md constraint 11), and when the children's
# protection exceeds this one, every child's share is scaled down.
[Slice]
MemoryMin=2G
MemoryLow=2.5G
