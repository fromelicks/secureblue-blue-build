# Make /sys/fs/pstore writable before archiving, so records can be unlinked.
#
# PID 1 mounts pstore read-only during early mount-setup, long before
# systemd-modules-load.service loads ramoops from
# /etc/modules-load.d/fromelicks-ramoops.conf. A mount does not re-evaluate
# afterwards, so the filesystem stays ro for the life of the boot even once the
# backend has attached -- confirmed after the reboot that first put the
# reserve_mem= region on the command line:
#
#   $ cat /sys/module/pstore/parameters/backend
#   ramoops
#   $ grep pstore /proc/mounts
#   none /sys/fs/pstore pstore ro,seclabel,nosuid,nodev,noexec,relatime 0 0
#
# Read-only is enough to *copy* a record to /var/lib/systemd/pstore but not to
# unlink it afterwards, and /usr/lib/systemd/systemd-pstore carries no remount
# logic of its own. Without this the 2 MiB region is never cleared: the first
# crash fills it and every crash after that captures nothing -- the exact
# silent-failure shape docs/crash-capture.md exists to prevent.
#
# ExecStartPre runs after the unit's conditions, and the unit carries
# ConditionDirectoryNotEmpty=/sys/fs/pstore, so on an ordinary boot with no
# records this never executes.
#
# See docs/crash-capture.md.

[Service]
ExecStartPre=/usr/bin/mount -o remount,rw /sys/fs/pstore
