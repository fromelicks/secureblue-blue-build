# Do not archive pstore records before the ramoops backend has registered.
#
# systemd-pstore.service is DefaultDependencies=no, Before=sysinit.target, and
# orders only After=modprobe@efi_pstore.service. systemd-modules-load.service --
# which inserts ramoops from /etc/modules-load.d/fromelicks-ramoops.conf -- has
# the same two properties and no ordering relative to it, so the two are
# scheduled concurrently.
#
# Records only appear in /sys/fs/pstore once a backend registers. If
# systemd-pstore.service evaluates its ConditionDirectoryNotEmpty first, it is
# skipped, and the crash record from the previous boot is lost when the region
# is overwritten -- the silent evidence loss docs/crash-capture.md exists to
# prevent. On the boot where this was found, ramoops was inserted at monotonic
# 45.567 and the condition evaluated at 47.459: correct by luck, not ordering.
#
# This mirrors the Wants=/After= pair the unit already carries for efi_pstore.
# modprobe@.service is a systemd template, so no unit needs to be shipped for
# it; ramoops is still loaded via modules-load.d, and the dependency here only
# establishes that the module is in place before the condition is tested.
#
# See docs/crash-capture.md.

[Unit]
Wants=modprobe@ramoops.service
After=modprobe@ramoops.service
