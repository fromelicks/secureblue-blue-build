# MATLAB R2026a + Simulink, in a distrobox.
#
# Bump this when a change must reach existing per-machine copies; `ujust
# matlab-box` re-seeds any copy with a lower revision, keeping its license line.
# fromelicks-matlab-manifest: 3
#
# Template. `ujust matlab-box` copies this to ~/.config/distrobox/matlab.ini
# and assembles from the copy -- edit that, not this file.
#
# MATLAB itself is installed by hand into ~/.local/share/matlab-distrobox,
# mounted here at /opt/matlab. The container supplies the MathWorks-supported
# userspace, the host supplies the display.
#
# Needs `ujust set-container-userns on`. Does NOT need `set-xwayland on` --
# `ujust matlab` starts a private Xwayland per invocation.
# See docs/matlab-distrobox.md.

[matlab]

# RHEL 9 is MathWorks-supported for R2026a, and registry.access.redhat.com is
# already trusted by secureblue's default-reject policy.json -- so no overlay.
# quay.io/toolbx-images (the obvious Ubuntu choice) went auth-only, and the one
# Ubuntu image in a trusted namespace, ghcr.io/ublue-os/ubuntu-toolbox, is now
# 26.04, which MathWorks does not support.
image=registry.access.redhat.com/ubi9/toolbox:latest
pull=true

# The mex and Simulink Coder toolchain.
additional_packages=gcc gcc-c++ gcc-gfortran make unzip

# The release must match matlab_release in the ujust recipes.
init_hooks=bash /run/host/usr/libexec/fromelicks-matlab-box-setup R2026a

# Your license server. MATLAB-specific on purpose: LM_LICENSE_FILE would also
# be read by every other FlexLM client on the machine.
additional_flags=--env MLM_LICENSE_FILE=27000@matlab-license.example.invalid

# distrobox sets SHELL to a bare `bash`, and MATLAB execs $SHELL for every
# system() call, so all shell-outs (mex, make, Simulink Coder) fail with 127.
# These flags come after distrobox's own --env, so this value wins for every
# way into the box.
additional_flags=--env SHELL=/bin/bash

# MATLAB lives on the host, so re-creating the container is cheap.
volume=${HOME}/.local/share/matlab-distrobox:/opt/matlab:rw

# Host GPU libraries, for gpuArray / GPU Coder. Set false if OpenGL breaks:
# distrobox prepends the host driver dirs to ld.so.conf and can shadow the
# container's libGL.
nvidia=true

# The license server is reached over the host's routing, including VPNs.
# Do NOT set unshare_netns.

# Drops distrobox's terminal entry. The MATLAB desktop entry is written on the
# host by `ujust matlab-box`; distrobox-export would produce one that runs
# without an X server.
entry=false

start_now=true
