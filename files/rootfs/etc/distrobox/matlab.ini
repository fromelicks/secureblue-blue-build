# MATLAB R2026a + the Simulink product family, in a distrobox.
#
# This file is the TEMPLATE baked into the image. `ujust matlab-box` seeds a
# per-machine copy at ~/.config/distrobox/matlab.ini (and one of
# matlab-products.txt beside it) and runs assemble against those, because the
# license server and the product set are site configuration, not image
# configuration. Edit the copies, not this file.
#
# Preconditions on secureblue:
#   * container-domain userns -- REQUIRED, and enforced by `ujust matlab-box`:
#     podman cannot create the container without it.
#         ujust set-container-userns on
#   * an X server -- MATLAB has no Wayland backend. This is NOT enforced, and
#     is not a single answer: the Niri session (xwayland-satellite) and xpra
#     both work with GNOME's Xwayland left disabled. `ujust matlab-box` prints
#     a note when the running GNOME session cannot provide one.
#         ujust set-xwayland on     -- only if you want it from GNOME
#
# See docs/matlab-distrobox.md.

[matlab]

# Ubuntu 24.04 is a MathWorks-supported platform for R2026a, and
# quay.io/toolbx-images is already trusted by secureblue's default-reject
# /etc/containers/policy.json -- so this needs no container-policy overlay.
image=quay.io/toolbx-images/ubuntu-toolbox:24.04
pull=true

# Installed before the init hooks run, so the setup script can rely on them.
# gcc/g++/gfortran/make are the mex and Simulink Coder toolchain.
additional_packages=ca-certificates curl wget unzip gcc g++ gfortran make xpra

# Everything else -- MathWorks' own dependency list, mpm, the products, the
# desktop entry -- happens here. The script is idempotent and exits immediately
# once the install is complete, so this only costs time on the first start.
init_hooks=bash /run/host/usr/libexec/fromelicks-matlab-box-setup

# The network license. Replace with your own port@host, or point it at a
# colon-separated list of servers for a triad. MATLAB-specific on purpose:
# LM_LICENSE_FILE would also be consulted by every other FlexLM client.
# The container shares the host network namespace, so if the license server is
# only reachable over a VPN, bringing that VPN up on the host is sufficient.
additional_flags=--env MLM_LICENSE_FILE=27000@matlab-license.example.invalid

# MATLAB lives on the host so that destroying and re-creating the container
# does not mean re-downloading tens of gigabytes. ${HOME} is expanded by
# distrobox-assemble, which sources the parsed manifest.
volume=${HOME}/.local/share/matlab-distrobox:/opt/matlab:rw

# Host GPU libraries, for gpuArray / GPU Coder. Harmless for plain Simulink:
# the container still renders through Mesa on the iGPU by default. Set to
# false if MATLAB's OpenGL breaks -- distrobox prepends the host driver
# directories to ld.so.conf, which occasionally shadows container libraries.
nvidia=true

# Do NOT set unshare_netns: the license checkout needs the host network.

# Drops distrobox's own terminal entry for the container. Note this does NOT
# affect the exported application's name: distrobox-assemble passes no
# --export-label, so distrobox-export falls back to " (on matlab)" and the app
# grid shows "MATLAB R2026a (on matlab)" regardless.
entry=false

start_now=true
exported_apps=matlab
exported_bins=/usr/local/bin/matlab
