# Load the RAM-backed panic logger at boot.
#
# ramoops writes the panic dmesg into a reserved physical memory region that
# survives a warm reboot; systemd-pstore.service then archives it to
# /var/lib/systemd/pstore on the next boot. The region is declared by the
# reserve_mem= and ramoops.mem_name= kernel arguments set in the recipe.
#
# EFI pstore is not an alternative here: efi_pstore.pstore_disable defaults to Y
# on Fedora, and writing panic records into EFI NVRAM is a known way to brick
# some firmware. ramoops touches only RAM.
ramoops
