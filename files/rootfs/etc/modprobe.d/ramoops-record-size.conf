# ramoops stores only Part 1 of any crash dump: fs/pstore/ram.c bails out with
# -ENOSPC for record->part != 1, on the assumption -- stated in its own comment --
# that one record is bigger than pstore's per-dump budget. It is not here.
# pstore.kmsg_bytes is 10240 and ramoops' default record_size is 4096, so
# pstore_dump() splits every crash across three parts, ramoops refuses parts 2
# and 3, and what survives the reboot is the *oldest* ~4 KiB of the dump -- the
# tail of the backtrace. The `Oops:`/`BUG:` line, the CPU/PID/Comm field naming
# the process, the faulting RIP and the top stack frames are all in part 2 and
# are lost. Observed on the 2026-08-31 skb_clone panic, which logged
# "pstore: backend (ramoops) writing error (-28)" and left two Part1-only records.
#
# One record larger than kmsg_bytes makes the dump single-part, which is the
# condition ram.c already assumes. 32 KiB leaves headroom if kmsg_bytes is ever
# raised (worth doing -- the "Modules linked in" list alone is ~3.5 KiB of the
# budget -- but pstore is built-in, so that one is karg-only; see
# docs/crash-capture.md).
#
# This is a modprobe.d option and NOT a recipe karg on purpose: ramoops is a
# module, so modprobe applies this at load time, and it sidesteps the kargs.d
# delta trap in AGENTS.md constraint 13 entirely. Do not "consolidate" it into
# the kargs block.
#
# PRECEDENCE -- verified with `modprobe -C <dir> -c`: kmod emits modprobe.d
# options FIRST and kernel-cmdline options LAST, and module_param takes the last
# assignment, so anything on /proc/cmdline BEATS this file. (kmod parses
# /proc/cmdline itself; that is how ramoops.mem_name= and ramoops.ecc= reach a
# loadable module at all.) Nothing sets ramoops.record_size on the cmdline
# today, so this applies. If a ramoops.record_size= karg is ever added -- or
# pinned into a BLS entry via x-options-source, which survives deletion from the
# recipe -- it will silently override this file and there will be no warning.
# Check /proc/cmdline before concluding this file is broken.
#
# The rest of the ramoops config stays in the recipe kargs on purpose:
# reserve_mem= is a core kernel early-boot reservation with no module-option
# equivalent, and mem_name= is coupled to it by the literal string "oops".
options ramoops record_size=32768
