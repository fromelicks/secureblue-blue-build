# Disable USB autosuspend for the Intel Bluetooth adapter.
#
# btusb defaults to enable_autosuspend=Y, which lets the USB BT host controller
# power down after 2 s of idle. BLE HID devices (mice) cannot issue a USB remote-
# wakeup, so once the adapter enters a deeper suspend state it never comes back —
# requiring a reboot to recover. Pattern: brief disconnect/reconnect 1-2×, then
# permanent disconnect ~5-10 min after login.
options btusb enable_autosuspend=0
