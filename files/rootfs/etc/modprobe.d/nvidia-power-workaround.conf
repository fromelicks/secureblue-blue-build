# Workaround for gnome-shell ~5-min deadlock after suspend/resume on Optimus.
#
# Root cause (suspected): NVIDIA fine-grained DPM (level 3, default on this image)
# powers down the GPU when video memory usage drops below the threshold (default 200 MB).
# On an idle desktop (~5 min post-login), usage drops below 200 MB, the GPU enters
# D3cold runtime-suspend. When mutter next needs the GPU, waking it under iommu.strict=1
# deadlocks the KMS thread, hanging gnome-shell.
#
# Fix: set threshold to 0 MB — GPU powers down only when no VRAM is allocated, which
# never happens in practice while a Wayland compositor is running. Fine-grained DPM
# stays enabled for the suspend/hibernate path; only idle power-down is suppressed.
#
# Trade-off: slight increase in idle power consumption compared to default (200 MB).
# If hang persists, escalate to full DPM disable:
#   options nvidia NVreg_DynamicPowerManagement=0
options nvidia NVreg_DynamicPowerManagementVideoMemoryThreshold=0
