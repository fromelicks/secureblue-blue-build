[Manager]
# Bound the final reboot phase if shutdown itself stalls. This setting does not
# detect runtime desktop hangs; gnome-hang-monitor.service handles GNOME Shell.
#
# RebootWatchdogSec= only arms once systemd-shutdown runs, i.e. after every unit
# has stopped. On 2026-11-09 the DIFR lock-screen wedge (see
# docs/nvidia-dpms-lock-hang.md) stalled the shutdown long before that, twice in
# one day, and the machine sat dead for 69 min and 2 h 46 min.
RebootWatchdogSec=5min

# Hand the iTCO_wdt hardware watchdog to PID 1 for the whole uptime, not just
# the final reboot phase. This is the only backstop that survives a PID 1 which
# has stopped running its event loop, and on this machine that is the failure
# that keeps needing the power button: the DIFR wedge leaves
# "plymouth show-splash" stuck uninterruptibly in the NVIDIA driver, that start
# job is ordered Before=systemd-reboot.service so the reboot can never proceed,
# and PID 1 goes silent at that exact moment. Everything we had until now --
# reboot.target's JobTimeoutAction=reboot-force, the monitor's transient
# systemd-run force-reboot timer, RebootWatchdogSec= above -- needs PID 1 to
# still be dispatching jobs, so all three were armed and none of them fired.
#
# systemd programs the hardware timeout to this value and pings at half the
# interval, so a PID 1 that stops for more than ~2 min gets the machine reset.
# That is far longer than any legitimate PID 1 stall (its own work is a few ms of
# event-loop dispatch, and init.scope has MemoryMin= so reclaim cannot push it
# out -- see docs/memory-pressure-hangs.md) and far shorter than the multi-hour
# outages above.
#
# Deliberately no RuntimeWatchdogPreSec=/RuntimeWatchdogPreGovernor=: a panic
# pretimeout would be the only way to capture evidence of what PID 1 was stuck
# on, but iTCO_wdt exposes no "pretimeout" attribute in
# /sys/class/watchdog/watchdog0, so the governor has nothing to drive. A plain
# reset leaves no dump; the evidence has to come from the monitor's snapshots
# taken before the reboot.
#
# nowayout=0 on this device, so the watchdog is released cleanly on an orderly
# shutdown and does not force a reset of its own.
RuntimeWatchdogSec=2min
