# Enlarge zram from Fedora's min(ram, 8192). See docs/memory-pressure-hangs.md.
#
# A drop-in, not /etc/systemd/zram-generator.conf: the generator uses only the
# first main config it finds, so an /etc main file would replace Fedora's whole
# [zram0] section instead of overriding one key.
[zram0]

# zram pages stay resident: each GiB held costs ~0.4 GiB of RAM here (3.3x
# compression plus ~28% zsmalloc overhead -- size against mem_used_total in
# /sys/block/zram0/mm_stat, not the ratio). The cap bounds that at ~6 GiB.
zram-size = min(ram / 2, 16384)

# Deliberately unset:
#
# zram-resident-limit -- without a writeback-device it breaks the fallthrough
# to /var/swapfile. The swap allocator picks devices by priority and free
# slots, so a zram at its mem_limit still wins, its writes fail with -ENOMEM,
# and the page stays in RAM instead of reaching the disk tier.
#
# compression-algorithm with (type=idle) recompression -- inert unless
# something writes /sys/block/zram0/idle and .../recompress, and nothing does.
# lzo-rle (the default) stays until a measurement says otherwise.
