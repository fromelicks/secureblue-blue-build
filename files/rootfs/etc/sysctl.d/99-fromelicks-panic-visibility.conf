# Give a kernel panic long enough on screen to be read or photographed.
#
# secureblue sets kernel.panic=-1 in /usr/lib/sysctl.d/55-hardening.conf, which
# means "reboot immediately, zero delay". On a KMS console that renders as a
# brief colour flash and an instant reboot with no readable message -- which is
# exactly what happened on 2026-08-26 at 22:35:08, leaving no evidence at all.
#
# Precedence, precisely: sysctl.d(5) sorts ALL files across /etc, /run and
# /usr/lib by *basename*, and the lexicographically last one wins. The /etc
# directory only overrides /usr/lib for a file of the SAME name. So this file
# beats 55-hardening.conf because 99- sorts after 55-, NOT because it lives in
# /etc. Do not rename it to a lower prefix: that silently restores
# kernel.panic=-1 and reopens the undiagnosable-crash hole.
#
# The hardening intent is preserved: the machine still always reboots and never
# continues running on a panicked kernel. It just stops being undiagnosable.
# To restore secureblue's behaviour, delete this file or set the value to -1.
kernel.panic = 30
