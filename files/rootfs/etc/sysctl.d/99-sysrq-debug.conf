# Enable emergency keyboard recovery during a hard hang.
# Alt+SysRq+S = sync filesystems
# Alt+SysRq+U = remount read-only
# Alt+SysRq+B = reboot
#
# Bits: sync(16) + remount-ro(32) + reboot(128) = 176
# Memory-dump and kernel-debug keys are blocked by lockdown=confidentiality regardless.
kernel.sysrq = 176
